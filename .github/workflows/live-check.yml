name: Public API checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.8.8'
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/smoke_mcp.py --live
      - run: uv export --project plugins/oss-gate --frozen --no-dev --no-emit-project --output-file runtime-requirements.txt
      - run: uv run --frozen pip-audit --requirement runtime-requirements.txt --no-deps --disable-pip
