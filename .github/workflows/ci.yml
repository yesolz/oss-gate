name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-15-intel
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.8.8'
      - run: uv sync --frozen --python 3.13
      - run: uv sync --frozen --project plugins/oss-gate --python ${{ matrix.python }}
      - run: uv run --frozen python scripts/build_cli_plugin.py --check
      - run: uv run --frozen ruff check .
      - run: uv run --frozen --project plugins/oss-gate python -m unittest discover -s tests -v
      - run: uv run --frozen python scripts/smoke_mcp.py
      - run: uv run --frozen python scripts/build_examples.py
      - run: uv run --frozen python scripts/build_site.py
      - run: uv run --frozen python scripts/check_distribution.py
      - run: uv run --frozen python scripts/package_release.py
